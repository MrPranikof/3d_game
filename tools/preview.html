<!doctype html><html><body style="margin:0;background:#888"><canvas id="c" width="1500" height="900"></canvas>
<script type="module">
// Dev preview: builds one procedural asset and renders it from several fixed angles.
// /tools/preview.html?id=tank_t72b3&v=az,el;az,el  (degrees; az 0 = from the front)
import * as THREE from 'three';
import { ProceduralEngine } from '/src/assets/procedural/ProceduralEngine.ts';
import { debugRefStrips, preloadRefTextures, preloadTreeTextures, preloadWeaponRefs } from '/src/assets/procedural/RefTexture.ts';
import { getSpec } from '/src/assets/AssetRegistry.ts';
import { preloadPhotoTextures } from '/src/assets/procedural/MaterialLibrary.ts';
import { QUALITY } from '/src/assets/StylePreset.ts';
const q = new URLSearchParams(location.search);
await Promise.all([preloadPhotoTextures(), preloadRefTextures(), preloadTreeTextures(), preloadWeaponRefs()]);
if (q.get('dbg')) debugRefStrips(q.get('dbg'));
const { root } = new ProceduralEngine(QUALITY.desktop).build(getSpec(q.get('id')), q.get('team') || 'A');
if (q.get('yaw')) { const t = root.getObjectByName('Turret'); if (t) t.rotation.y = +q.get('yaw'); }
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xb8c2c8);
sc.add(new THREE.HemisphereLight(0xdfe8ff, 0x55503f, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.position.set(-6, 10, -5); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); sun.shadow.mapSize.set(2048, 2048); sc.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x6b6450 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);
root.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
sc.add(root);
{ const b0 = new THREE.Box3().setFromObject(root); if (b0.min.y < 0) root.position.y -= b0.min.y; } // stand on the ground plane
const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length() / 2;
const views = (q.get('v') || '35,20;90,0;0,90;160,25').split(';').map((s) => s.split(',').map(Number));
const cols = views.length > 2 ? 2 : views.length, rows = Math.ceil(views.length / cols);
const W = 1500 / cols, H = 900 / rows; r.setScissorTest(true);
views.forEach(([az, el], i) => {
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el), d = R / Math.sin(THREE.MathUtils.degToRad(15)) * +(q.get("zoom") || 0.6);
  cam.position.set(c.x - Math.sin(a) * Math.cos(e) * d, c.y + Math.sin(e) * d, c.z - Math.cos(a) * Math.cos(e) * d);
  if (el > 85) cam.up.set(0, 0, -1);
  cam.lookAt(c);
  const x = (i % cols) * W, y = 900 - (Math.floor(i / cols) + 1) * H;
  r.setViewport(x, y, W, H); r.setScissor(x, y, W, H); r.render(sc, cam);
});
window.__root = root;
window.done = true;
</script></body></html>
